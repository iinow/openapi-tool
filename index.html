<body>
<div class="header">
    <h1>OpenAPI JSON 서브셋 생성기</h1>
</div>

<div class="container">
    <div class="card">
        <div class="btn-row">
            <div class="file-input-wrapper">
                <label for="fileInput" class="file-input-label">
                    <span class="material-icons">upload_file</span>
                    OpenAPI JSON 파일 선택
                </label>
                <input type="file" id="fileInput" accept=".json">
            </div>
            
            <input type="text" id="domainInput" class="text-field" placeholder="예: https://api.example.com">
            
            <button onclick="selectAll(true)" class="btn btn-secondary">
                <span class="material-icons">select_all</span>
                전체 선택
            </button>
            
            <button onclick="selectAll(false)" class="btn btn-secondary">
                <span class="material-icons">deselect</span>
                전체 해제
            </button>
            
            <button onclick="generateSubset()" class="btn btn-success">
                <span class="material-icons">check_circle</span>
                선택된 API로 Swagger 생성
            </button>
            
            <button onclick="generateRedoc()" class="btn">
                <span class="material-icons">description</span>
                Redoc으로 다운받기
            </button>
            
            <button onclick="generatePDF()" class="btn">
                <span class="material-icons">picture_as_pdf</span>
                PDF로 다운받기
            </button>

            <button onclick="openapi2markdown()" class="btn">
                <span class="material-icons">markdown</span>
                Markdown으로 다운받기
            </button>
        </div>
    </div>

    <div id="apiList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js/dist/html2pdf.bundle.min.js"></script>
<script src="src/openapi.js"></script>
<script src="src/openapi2markdown.js"></script>
<script>
    let fullSpec = null;
    let apiMap = {};

    document.getElementById('fileInput').addEventListener('change', async function () {
        const file = this.files[0];
        const text = await file.text();
        fullSpec = JSON.parse(text);
        buildApiList(fullSpec);
    });

    function buildApiList(spec) {
        apiMap = {};
        const container = document.getElementById('apiList');
        container.innerHTML = '';

        for (const path in spec.paths) {
            for (const method in spec.paths[path]) {
                const op = spec.paths[path][method];
                const tags = op.tags || ['default'];
                tags.forEach(tag => {
                    if (!apiMap[tag]) apiMap[tag] = [];
                    apiMap[tag].push({path, method, operationId: op.operationId});
                });
            }
        }

        for (const tag in apiMap) {
            const section = document.createElement('div');
            section.className = 'tag';
            
            // Create tag header
            const tagHeader = document.createElement('div');
            tagHeader.className = 'tag-header';
            tagHeader.innerHTML = `<h3>${tag}</h3>`;
            section.appendChild(tagHeader);
            
            // Create tag content container
            const tagContent = document.createElement('div');
            tagContent.className = 'tag-content';
            section.appendChild(tagContent);

            apiMap[tag].forEach(api => {
                // Create API item container
                const apiItem = document.createElement('div');
                apiItem.className = 'api-item';
                
                // Create custom checkbox
                const checkboxLabel = document.createElement('label');
                checkboxLabel.className = 'custom-checkbox';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'api-checkbox';
                checkbox.dataset.path = api.path;
                checkbox.dataset.method = api.method;
                
                const checkmark = document.createElement('span');
                checkmark.className = 'checkmark';
                
                checkboxLabel.appendChild(checkbox);
                checkboxLabel.appendChild(checkmark);
                
                // Create method span with color coding
                const methodSpan = document.createElement('span');
                methodSpan.className = `method method-${api.method.toLowerCase()}`;
                methodSpan.textContent = api.method.toUpperCase();
                
                // Create path span
                const pathSpan = document.createElement('span');
                pathSpan.className = 'path';
                pathSpan.textContent = api.path;
                
                // Assemble API item
                apiItem.appendChild(checkboxLabel);
                apiItem.appendChild(methodSpan);
                apiItem.appendChild(pathSpan);
                
                tagContent.appendChild(apiItem);
            });

            container.appendChild(section);
        }
    }

    function selectAll(checked) {
        document.querySelectorAll('.api-checkbox').forEach(cb => cb.checked = checked);
        
        // Add visual feedback for Material UI styling
        if (checked) {
            document.querySelectorAll('.tag').forEach(tag => {
                tag.classList.add('selected');
            });
        } else {
            document.querySelectorAll('.tag').forEach(tag => {
                tag.classList.remove('selected');
            });
        }
    }

    /**
     * 선택된 API와 도메인으로 서브셋 Swagger JSON 생성
     * @returns {{swagger: string, info: *, servers: [{url: (*|string)}], paths: {}, components: {schemas: {}}}|null}
     */
    function getSubsetSpec() {
        if (!fullSpec) {
            alert('Swagger 파일을 먼저 업로드하세요.');
            return null;
        }

        const domain = document.getElementById('domainInput').value.trim();
        if (!domain) {
            alert('도메인(서버 URL)을 입력해주세요.');
            return null;
        }

        const checkboxes = document.querySelectorAll('.api-checkbox');
        const selectedPaths = {};
        const usedRefs = new Set();

        checkboxes.forEach(cb => {
            if (cb.checked) {
                const path = cb.dataset.path;
                const method = cb.dataset.method;
                const op = fullSpec.paths[path][method];

                if (!selectedPaths[path]) selectedPaths[path] = {};
                selectedPaths[path][method] = op;

                collectRefsFromOperation(op, usedRefs);
            }
        });

        const allSchemas = fullSpec.components?.schemas || {};
        const filteredSchemas = {};

        function collectSchemaRecursively(refName) {
            if (filteredSchemas[refName] || !allSchemas[refName]) return;
            filteredSchemas[refName] = allSchemas[refName];

            const nestedRefs = findRefs(allSchemas[refName]);
            nestedRefs.forEach(r => {
                const name = r.replace('#/components/schemas/', '');
                collectSchemaRecursively(name);
            });
        }

        usedRefs.forEach(fullRef => {
            const name = fullRef.replace('#/components/schemas/', '');
            collectSchemaRecursively(name);
        });

        const subsetSpec = {
            // "swagger": "2.0",
            "openapi": "3.0.1",
            // openapi: fullSpec.openapi,
            info: fullSpec.info,
            servers: [{url: domain}],
            paths: selectedPaths,
            components: {schemas: filteredSchemas}
        };

        return subsetSpec;
    }

    function generateSubset() {
        const subsetSpec = getSubsetSpec();
        if (!subsetSpec) return;

        const blob = new Blob([JSON.stringify(subsetSpec, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'subset-swagger.json';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    async function generateRedoc() {
        const subsetSpec = getSubsetSpec();
        if (!subsetSpec) return;

        // const blob = new Blob([JSON.stringify(subsetSpec, null, 2)], { type: 'application/json' });
        // const formData = new FormData();
        // formData.append('swagger', blob, 'subset-swagger.json');

        const file = new File(
            [JSON.stringify(subsetSpec, null, 2)],
            'subset-swagger.json',
            {type: 'application/json'}
        );

        const formData = new FormData();
        formData.append('swagger', file);

        try {
            const res = await fetch('https://146.56.38.67:9999/api/generate-redoc', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) throw new Error(`서버 오류: ${res.status}`);

            const html = await res.text();
            const htmlBlob = new Blob([html], {type: 'text/html'});
            const url = URL.createObjectURL(htmlBlob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'redoc.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

        } catch (err) {
            console.error('Redoc 생성 실패:', err);
            alert('Redoc 생성 중 오류 발생');
        }
    }

    function createPDF(markdownString) {
        // marked로 마크다운을 HTML로 변환
        const htmlContent = marked.parse(markdownString);

        // HTML 템플릿 생성
        const template = `

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <style>

            font-size: 16px;

        table th, table td {

        }

        /* 코드 블록 스타일 */
        pre {

        .method {
            display: inline-block;
            padding: 4px 8px;

        }
        
        .get {
            background-color: #61affe;
        }
        
        .post {
            background-color: #49cc90;
        }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/json-pretty-html@1.1.6/dist/bundle.min.js"><\/script>
    <link href="https://cdn.jsdelivr.net/npm/json-pretty-html@1.1.6/style.min.css" rel="stylesheet">
    </head>
    <body>
        ${htmlContent}
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js/dist/html2pdf.bundle.min.js"><\/script>
    <script>
        const opt = {
            margin: [10, 10],
            filename: 'api-documentation.pdf',
            image: { type: 'jpeg', quality: 0.98 },

        // PDF 생성 및 다운로드
        html2pdf().set(opt).from(document.body).save();
    <\/script>

        return template;

    /**
     * PDF 생성
     * @returns {Promise<void>}
     */
    async function generatePDF() {
        const subsetSpec = getSubsetSpec();
        if (!subsetSpec) return;

        const markdownString = convertToMarkdown(subsetSpec);

        const htmlContent = createPDF(markdownString);

        // Create a temporary div to hold the HTML content
        const tempDiv = document.createElement('div');
        tempDiv.className = 'pdf-content';
        tempDiv.innerHTML = htmlContent;
        tempDiv.style.padding = '20px';
        document.body.appendChild(tempDiv);

        try {
            // Configure html2pdf options
            const options = {
                margin: 10,
                filename: 'api-documentation.pdf',
                image: {type: 'jpeg', quality: 0.98},
                html2canvas: {scale: 2},
                jsPDF: {unit: 'mm', format: 'a4', orientation: 'portrait'}
            };

            // Generate and download the PDF
            await html2pdf().from(tempDiv).set(options).save();
        } catch (error) {
            console.error('PDF 생성 중 오류 발생:', error);
            alert('PDF 생성 중 오류가 발생했습니다.');
        } finally {
            // Clean up the temporary div
            document.body.removeChild(tempDiv);
        }
    }

    function downloadMarkdown(content) {
        // Blob 객체 생성 (MIME 타입은 text/markdown)
        const blob = new Blob([content], { type: "text/markdown" });
        
        // Blob을 가리키는 URL 생성
        const url = URL.createObjectURL(blob);
        
        // 임시 <a> 태그 생성
        const a = document.createElement("a");
        a.href = url;
        a.download = "test.md"; // 다운로드 파일 이름
        
        // 클릭 이벤트로 다운로드 트리거
        document.body.appendChild(a);
        a.click();
        
        // cleanup
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    async function openapi2markdown(spec) {
        const subsetSpec = getSubsetSpec();
        if (!subsetSpec) return;

        const markdownString = convertToMarkdown(subsetSpec);

        downloadMarkdown(markdownString)
    }

    function collectRefsFromOperation(op, usedRefs) {
        const jsonStr = JSON.stringify(op);
        const matches = jsonStr.match(/"\$ref":\s*"(#\/components\/schemas\/[^"]+)"/g);
        if (matches) {
            matches.forEach(m => {
                const ref = m.match(/"(#\/components\/schemas\/[^"]+)"/)[1];
                usedRefs.add(ref);
            });
        }
    }

    function findRefs(obj) {
        const refs = [];

        function recurse(o) {
            if (typeof o !== 'object' || o === null) return;
            for (const k in o) {
                if (k === '$ref' && typeof o[k] === 'string' && o[k].startsWith('#/components/schemas/')) {
                    refs.push(o[k]);
                } else {
                    recurse(o[k]);
                }
            }
        }

        recurse(obj);
        return refs;
    }
</script>
